server:
  port: 8083

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

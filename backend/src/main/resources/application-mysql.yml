server:
  port: 8080

spring:
  datasource:
    username: app
    password: app_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://db:3306/WorkManagement?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: info
    org.hibernate.SQL: debug

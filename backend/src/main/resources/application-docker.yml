server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/WorkManagement?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: info
    org.hibernate.SQL: debug

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

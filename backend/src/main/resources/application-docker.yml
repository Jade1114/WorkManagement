server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/WorkManagement?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: app
    password: app_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: info
    org.hibernate.SQL: debug

wechat:
  appid: ""   # 填写你的小程序 appid
  secret: ""  # 填写你的小程序 secret

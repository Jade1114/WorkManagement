services:
  mysql:
    image: mysql:8.0
    container_name: workmanagement-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_DATABASE: work_management
      MYSQL_USER: app
      MYSQL_PASSWORD: app_pass
      MYSQL_ROOT_PASSWORD: root_pass
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nacos:
    image: nacos/nacos-server:v2.3.2
    platform: linux/amd64
    container_name: workmanagement-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"

  nacos-config-init:
    image: curlimages/curl:8.8.0
    container_name: workmanagement-nacos-config-init
    restart: "no"
    depends_on:
      - nacos
    volumes:
      - ./docker/nacos:/config:ro
    entrypoint: ["/bin/sh", "/config/init-config.sh"]

  user-service:
    build:
      context: ./cloud
      dockerfile: Dockerfile.service
      args:
        MODULE: user-service
    container_name: workmanagement-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    expose:
      - "8081"

  education-service:
    build:
      context: ./cloud
      dockerfile: Dockerfile.service
      args:
        MODULE: education-service
    container_name: workmanagement-education-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    expose:
      - "8082"

  gateway:
    build:
      context: ./cloud
      dockerfile: Dockerfile.service
      args:
        MODULE: gateway-service
    container_name: workmanagement-gateway
    restart: unless-stopped
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      education-service:
        condition: service_started
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
    container_name: workmanagement-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"

volumes:
  mysql_data:
